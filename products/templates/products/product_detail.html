<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ product.name }} | Nova Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f7;

            color: #1d1d1f;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            background: #1d1d1f;

            padding: 18px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            color: white;

            text-decoration: none;

            font-size: 22px;

            font-weight: bold;
        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 25px;
        }


        .nav-links a {

            color: white;

            text-decoration: none;

            font-size: 15px;
        }


        .nav-links a:hover {

            opacity: 0.7;
        }


        /* =========================
           PRODUCT
        ========================= */

        .container {

            width: 90%;

            max-width: 1100px;

            margin: 70px auto;
        }


        .product {

            background: white;

            border-radius: 25px;

            padding: 50px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 60px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.07);
        }


        .product-image {

            width: 100%;

            height: 500px;

            object-fit: cover;

            border-radius: 18px;
        }


        .category {

            color: #777;

            font-size: 14px;

            margin-bottom: 15px;
        }


        .product-info h1 {

            font-size: 42px;

            margin: 0 0 20px;
        }


        .description {

            color: #555;

            line-height: 1.7;

            font-size: 17px;
        }


        .price {

            font-size: 30px;

            font-weight: bold;

            margin: 30px 0;
        }


        .back-button {

            display: inline-block;

            padding: 12px 22px;

            background: #0071e3;

            color: white;

            text-decoration: none;

            border-radius: 22px;
        }


        .back-button:hover {

            background: #005bb5;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            background: #1d1d1f;

            color: #aaa;

            text-align: center;

            padding: 30px;

            margin-top: 80px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .navbar {

                flex-direction: column;

                gap: 15px;
            }


            .nav-links {

                flex-wrap: wrap;

                justify-content: center;
            }


            .product {

                grid-template-columns: 1fr;

                padding: 25px;
            }


            .product-image {

                height: 350px;
            }


            .product-info h1 {

                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a
            href="{% url 'home' %}"
            class="logo"
        >
            Nova Store
        </a>


        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>


            {% if user.is_authenticated %}

                <a href="{% url 'account' %}">
                    My Account
                </a>

                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>



    <!-- =========================
         PRODUCT DETAILS
    ========================= -->

    <main class="container">

        <div class="product">


            <!-- PRODUCT IMAGE -->

            <div>

                {% if product.image %}

                    <img
                        src="{{ product.image.url }}"
                        alt="{{ product.name }}"
                        class="product-image"
                    >

                {% endif %}

            </div>



            <!-- PRODUCT INFORMATION -->

            <div class="product-info">

                <div class="category">

                    Category:

                    {{ product.category.name }}

                </div>


                <h1>
                    {{ product.name }}
                </h1>


                <p class="description">

                    {{ product.description }}

                </p>


                <div class="price">

                    ₹{{ product.price }}

                </div>


                <a
                    href="{% url 'home' %}"
                    class="back-button"
                >
                    Back to Store
                </a>

            </div>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026 Nova Store. All rights reserved.
        </p>

    </footer>


</body>

</html>
